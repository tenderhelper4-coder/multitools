<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Planner Tool - Enterprise</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#f4f6f9;margin:0;padding:0}
.container{max-width:1300px;margin:auto;padding:20px}
h1{text-align:center;color:#2c3e50;margin-bottom:5px}
.subtitle{text-align:center;color:#555;margin-bottom:20px}
.headerBox{background:#fff;padding:15px;border:2px solid #2c3e50;margin-bottom:15px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#2c3e50;color:#fff}
input,select{width:100%;padding:5px}
button{padding:8px 14px;margin:5px;border:none;background:#2c3e50;color:#fff;cursor:pointer;border-radius:4px}
button:hover{background:#1a242f}
.summary,.dashboard{background:#fff;padding:15px;margin-top:20px;border:1px solid #ddd}
.chart-container{background:#fff;margin-top:20px;padding:20px;border:1px solid #ddd}
textarea{width:100%;height:120px}
@media print{
button,.chart-container,.dashboard{display:none}
}
</style>
</head>
<body>

<div class="container">

<h1>Profit Planner Tool – Enterprise</h1>
<div class="subtitle">Professional Tender & Profit Planning System</div>

<div class="headerBox">
<label><strong>Select Department:</strong></label>
<select id="department">
<option>PWD</option>
<option>CPWD</option>
<option>Railways</option>
<option>IOCL</option>
<option>UPPCL</option>
<option>Custom</option>
</select>

<label><strong>Project Name:</strong></label>
<input type="text" id="projectName" placeholder="Enter Project Name">
</div>

<table id="costTable">
<thead>
<tr>
<th>Description</th>
<th>Qty</th>
<th>Unit Cost</th>
<th>Total</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tableBody">
<tr>
<td><input type="text"></td>
<td><input type="number" value="1" oninput="calculate()"></td>
<td><input type="number" value="0" oninput="calculate()"></td>
<td class="totalCost">0</td>
<td><button onclick="removeRow(this)">X</button></td>
</tr>
</tbody>
</table>

<button onclick="addRow()">+ Add Item</button>

<div class="summary">
<h3>Financial Summary</h3>
<p>Total Cost: ₹ <span id="totalCost">0</span></p>

<label>Profit Margin (%)</label>
<input type="number" id="profitMargin" value="15" oninput="calculate()">

<p>Profit Amount: ₹ <span id="profitAmount">0</span></p>
<p>Selling Price: ₹ <span id="sellingPrice">0</span></p>

<label>GST (%)</label>
<input type="number" id="gstRate" value="18" oninput="calculate()">

<p><strong>Final Quote Price: ₹ <span id="finalPrice">0</span></strong></p>
</div>

<div class="chart-container">
<canvas id="comparisonChart"></canvas>
</div>

<div class="summary">
<h3>Auto L1 Recommendation Note</h3>
<textarea id="l1Note"></textarea>
<button onclick="generateNote()">Generate L1 Note</button>
</div>

<div class="dashboard">
<h3>Multi Project Dashboard</h3>
<button onclick="saveToDashboard()">Save This Project</button>
<ul id="projectList"></ul>
</div>

<button onclick="exportPDF()">📄 Export Professional PDF</button>
<button onclick="window.print()">🖨 Print</button>

</div>

<script>
let chart;
let dashboardProjects=[];

function calculate(){
let rows=document.querySelectorAll("#tableBody tr");
let totalCost=0;
rows.forEach(row=>{
let qty=parseFloat(row.cells[1].querySelector("input").value)||0;
let unit=parseFloat(row.cells[2].querySelector("input").value)||0;
let total=qty*unit;
row.querySelector(".totalCost").innerText=total.toFixed(2);
totalCost+=total;
});
document.getElementById("totalCost").innerText=totalCost.toFixed(2);

let profitMargin=parseFloat(document.getElementById("profitMargin").value)||0;
let profitAmount=totalCost*profitMargin/100;
let sellingPrice=totalCost+profitAmount;

document.getElementById("profitAmount").innerText=profitAmount.toFixed(2);
document.getElementById("sellingPrice").innerText=sellingPrice.toFixed(2);

let gst=parseFloat(document.getElementById("gstRate").value)||0;
let finalPrice=sellingPrice+(sellingPrice*gst/100);
document.getElementById("finalPrice").innerText=finalPrice.toFixed(2);

updateChart(totalCost,sellingPrice,finalPrice);
}

function updateChart(cost,sell,finalP){
if(chart){chart.destroy();}
chart=new Chart(document.getElementById("comparisonChart"),{
data:{
labels:["Cost","Selling","Final Quote"],
datasets:[
{
type:'bar',
label:'Amount',
data:[cost,sell,finalP],
backgroundColor:['#3498db','#2ecc71','#e74c3c']
},
{
type:'line',
label:'Trend',
data:[cost,sell,finalP],
borderColor:'#000',
fill:false
}
]
}
});
}

function addRow(){
let row=document.createElement("tr");
row.innerHTML=`
<td><input type="text"></td>
<td><input type="number" value="1" oninput="calculate()"></td>
<td><input type="number" value="0" oninput="calculate()"></td>
<td class="totalCost">0</td>
<td><button onclick="removeRow(this)">X</button></td>`;
document.getElementById("tableBody").appendChild(row);
}

function removeRow(btn){
btn.parentElement.parentElement.remove();
calculate();
}

function generateNote(){
let dept=document.getElementById("department").value;
let project=document.getElementById("projectName").value;
let quote=document.getElementById("finalPrice").innerText;

let note=`Subject: L1 Recommendation for ${project}

As per financial evaluation under ${dept} department,
the quoted amount ₹ ${quote} is found lowest and financially viable.

Recommended for approval as L1 bidder.`;

document.getElementById("l1Note").value=note;
}

function saveToDashboard(){
let name=document.getElementById("projectName").value;
let amount=document.getElementById("finalPrice").innerText;
dashboardProjects.push({name,amount});
renderDashboard();
}

function renderDashboard(){
let list=document.getElementById("projectList");
list.innerHTML="";
dashboardProjects.forEach(p=>{
let li=document.createElement("li");
li.innerText=p.name+" - ₹ "+p.amount;
list.appendChild(li);
});
}

async function exportPDF(){
const { jsPDF } = window.jspdf;
let doc=new jsPDF();
doc.setFontSize(14);
doc.text("Profit Planner - Tender Report",20,20);
doc.text("Department: "+document.getElementById("department").value,20,30);
doc.text("Project: "+document.getElementById("projectName").value,20,40);
doc.text("Final Quote: ₹ "+document.getElementById("finalPrice").innerText,20,50);
doc.save("Tender-Report.pdf");
}

calculate();
</script>

</body>
</html>
